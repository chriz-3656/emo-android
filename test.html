<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emo Face Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { display: block; overflow-y: auto; padding: 20px; color: #fff; }
  h1 { text-align: center; margin-bottom: 20px; font-weight: 600; }
  .preview-area { height: 350px; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(84, 255, 243, 0.3); border-radius: 20px; margin-bottom: 20px; position: relative; background: rgba(3, 10, 22, 0.85); overflow: hidden; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>

<h1>Emo Emotion Tester</h1>

<div class="preview-area">
  <div class="face" id="face">
    <div class="head-animator">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth" id="mouth"></div>
    </div>
  </div>
</div>

<div class="buttons" id="buttons"></div>

<script>
  const emotions = [
    "neutral", "sleepy", "happy", "listening", "speaking", "dead", "angry", 
    "alert", "annoyed", "confused", "curious", "yawn", "arc-up", "side-eye", 
    "evil", "dizzy-line", "tilted", "closed-smile", "squeeze", "tiny", "spiral", 
    "love", "wink", "wide", "dizzy", "lowBattery"
  ];
  
  const face = document.getElementById("face");
  const buttonsDiv = document.getElementById("buttons");
  
  emotions.forEach(e => {
    const btn = document.createElement("button");
    btn.className = "control-button";
    btn.textContent = e;
    btn.onclick = () => {
      face.className = "face emotion-" + e;
    };
    buttonsDiv.appendChild(btn);
  });
</script>
</body>
</html>
